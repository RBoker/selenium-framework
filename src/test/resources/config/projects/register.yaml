project:
  id: "register"
  name: "Register"

application:
  baseUrl: "https://demo.automationtesting.in/Register.html"

execution:
  browser: "chrome"
  headless: false

timeouts:
  defaultSeconds: 10
  uiSeconds: 25

cucumber:
  features:
    - "classpath:features/register"
  glue:
    - "com.rboker.automation.tests.bdd.steps.register"
    - "com.rboker.automation.tests.bdd.hooks"
  tags: "@ui and @register"
  plugins:
    - "pretty"
    - "io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm"

evidence:
  screenshot:
    mode: EACH_SCENARIO   # NONE | FAILED_ONLY | EACH_STEP | EACH_SCENARIO
    attachToAllure: true
    saveToFile: true
