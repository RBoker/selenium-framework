project:
  id: "register"
  name: "Register"

application:
  baseUrl: "https://demo.automationtesting.in/Register.html"

execution:
  browser: "chrome"
  headless: false

timeouts:
  defaultSeconds: 10
  uiSeconds: 25

cucumber:
  features:
    - "classpath:features/register"
  glue:
    - "com.rboker.automation.projects.register.ui.steps"
    - "com.rboker.automation.hooks"
  tags: "@ui and @register"
  plugins:
    - "pretty"
    - "io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm"

evidence:
  screenshot:
    # NONE = não gera evidência
    # FAILED_ONLY = gera apenas em falha
    # EACH_STEP = gera a cada passo (mais pesado)
    # EACH_SCENARIO = gera ao final de cada cenário
    mode: EACH_SCENARIO
    attachToAllure: true
    saveToFile: true
