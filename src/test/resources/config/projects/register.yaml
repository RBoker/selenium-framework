project: register

cucumber:
  features: "classpath:features/register"
  glue:
    - "com.rboker.automation.tests.bdd.steps.register"
    - "com.rboker.automation.tests.bdd.hooks"
  tags: "@ui and @register"
  plugins:
    - "pretty"
    - "io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm"

ui:
  baseUrl: "https://demo.automationtesting.in/Register.html"
  browser: "chrome"
  headless: false
  timeoutSeconds: 10
  uiTimeoutSeconds: 25
