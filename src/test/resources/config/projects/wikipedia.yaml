project:
  id: "wikipedia"
  name: "Wikipedia"

application:
  baseUrl: "https://www.wikipedia.org"

execution:
  browser: "chrome"
  headless: false
  window:
    maximize: true

timeouts:
  defaultSeconds: 15
  pageLoadSeconds: 30
  implicitWaitSeconds: 0
  explicitWaitSeconds: 10

logging:
  level: "INFO"

cucumber:
  features:
    - "classpath:features/wikipedia"
  glue:
    - "com.rboker.automation.tests.bdd.steps.wikipedia"
    - "com.rboker.automation.tests.bdd.hooks"
  tags: "@ui and @wikipedia"
  plugins:
    - "pretty"
    - "io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm"

evidence:
  screenshot:
    # NONE = não gera evidência
    # FAILED_ONLY = gera apenas em falha
    # EACH_STEP = gera a cada passo (mais pesado)
    # EACH_SCENARIO = gera ao final de cada cenário
    mode: FAILED_ONLY
    attachToAllure: true
    saveToFile: true
